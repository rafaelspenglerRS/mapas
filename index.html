<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>RS em Dados 🧉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Importa a fonte Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/index.css"> <!-- Importa o CSS separado -->
</head>
<body>
  <!-- Cabeçalho ocupando 100% da largura -->
  <header>
    <div id="header-left">
      <!-- Ícone de menu para esconder/mostrar o menu -->
      <div id="menu-toggle" onclick="toggleSidebar()">☰</div>
      <div id="header-title">RS EM DADOS </div>
      <div id="invest-logo">
        <img src="./img/investRS_logoBranco1.png" alt="Invest RS" >
      </div>
    </div>
    <!-- Seletor de idiomas -->
    <div id="language-selector">
      <img src="./img/pt.png" alt="Português" title="Português" onclick="setLanguage('pt')">
      <img src="./img/en.png" alt="Inglês" title="English" onclick="setLanguage('en')">
      <img src="./img/es.png" alt="Espanhol" title="Español" onclick="setLanguage('es')">
    </div>
  </header>
  

  <!-- Container do conteúdo (abaixo do cabeçalho) -->
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
      <ul id="menu-items">
        <li>
          <a href="#" onclick="loadPage('maps.html')">
            <span class="menu-icon"><img src="./img/loc2.png" /></span>
            <span class="menu-label" id="menu-maps">Mapas</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="loadPage('https://app.powerbi.com/view?r=eyJrIjoiNWVlMWU2ODAtNWJlMS00NTk1LWJkNTgtMTFmYWM4NzAwN2RhIiwidCI6IjIxZTk0YjViLTA0OGItNDZlOS04ODkxLTljODcxNmJkNWI4NSJ9')">
            <span class="menu-icon"><img src="./img/barr.png" /></span>
            <span class="menu-label" id="menu-dashboards">Dashboards</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="loadPage('businessPanel.html')">
            <span class="menu-icon"><img src="./img/dash2.png" /></span>
            <span class="menu-label" id="menu-business">Painel de Negócios</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="loadPage('reports.html')">
            <span class="menu-icon"><img src="./img/papel-em-branco.png" /></span>
            <span class="menu-label" id="menu-reports">Relatórios</span>
          </a>
        </li>
      </ul>
    </div>
    
    <!-- Conteúdo principal -->
    <div id="content">
      <div id="iframe-container">
        <iframe id="mainFrame" src="maps.html" title="mapa"></iframe>
      </div>
    </div>
  </div>
  
  <script src="panelScript.js"></script>

</body>
</html>
